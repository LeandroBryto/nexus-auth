# fly.toml app configuration file generated for nexus-auth on 2026-01-12T11:13:50Z
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'nexus-auth'
primary_region = 'gru'

[build]

[http_service]
  internal_port = 8084
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '2gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
